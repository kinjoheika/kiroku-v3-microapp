<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiroku Config — Field Masterlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --navy: #0B1F3A; --navy-2: #143560;
  --blue: #1F5AD6; --blue-600: #1848B0; --blue-50: #EDF3FF; --blue-100: #D6E3FF;
  --tiffany: #0ABAB5; --tiffany-600: #067F7B; --tiffany-50: #E6F8F7; --tiffany-200: #A3E4E0;
  --bg: #F4F7FB; --surface: #FFFFFF; --line: #E1E7EF; --line-2: #C9D3E0;
  --text: #0B1F3A; --muted: #5A6A80;
  --green: #0E8A5F; --green-bg: #E2F5EC; --amber: #A45F00; --amber-bg: #FFF1D6;
  --red: #C0342C; --red-bg: #FDEBEA; --stale: #94A3B8;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(11, 31, 58, .05), 0 6px 20px rgba(11, 31, 58, .05);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); }
body { margin: 0; font: 14.5px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
h1 { font-size: 26px; line-height: 1.15; margin: 0; letter-spacing: -.02em; font-weight: 700; }
h2 { font-size: 16px; margin: 0 0 2px; font-weight: 650; letter-spacing: -.01em; }
p { margin: 6px 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.eyebrow { font-size: 12px; font-weight: 600; color: var(--tiffany-600); letter-spacing: .02em; margin-bottom: 4px; }
:focus-visible { outline: 3px solid var(--tiffany); outline-offset: 2px; }

/* Top bar */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 22px; padding: 8px 20px; background: linear-gradient(90deg, var(--navy), var(--navy-2)); color: #fff; position: sticky; top: 0; z-index: 40; }
.brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
.brand .mark { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, var(--tiffany), var(--blue)); display: grid; place-items: center; font-size: 14px; font-weight: 800; }
.topbar nav { display: flex; gap: 2px; flex-wrap: wrap; }
.topbar nav a { color: rgba(255,255,255,.75); padding: 10px 12px; min-height: 44px; display: inline-flex; align-items: center; text-decoration: none; border-radius: 8px; position: relative; font-weight: 500; }
.topbar nav a:hover { color: #fff; background: rgba(255,255,255,.06); }
.topbar nav a.on { color: #fff; }
.topbar nav a.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 5px; height: 3px; border-radius: 3px; background: var(--tiffany); }
.tools { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.dbstat { color: rgba(255,255,255,.6); }

/* Layout */
#app { padding: 20px; }
.page { margin: 0 auto; max-width: 1400px; }
.page-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stack > * + * { margin-top: 12px; }
.card { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; background: var(--surface); box-shadow: var(--shadow); }
.card-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.section-title { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 13px; color: var(--navy); margin: 18px 0 8px; }
.section-title::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--tiffany); }
.strip { display: flex; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 16px; box-shadow: var(--shadow); overflow: hidden; }
.strip > div { padding: 12px 18px; border-right: 1px solid var(--line); flex: 1 1 140px; }
.strip .k { font-size: 12.5px; color: var(--muted); }
.strip .v { font-family: var(--font); font-size: 24px; font-weight: 750; letter-spacing: -.02em; color: var(--navy); font-variant-numeric: tabular-nums; }

/* Controls */
input[type=search], input[type=text], select {
  width: 100%; min-height: 44px; padding: 8px 11px; border: 1px solid var(--line-2); border-radius: 8px; background: #fff; color: var(--text); font: inherit;
}
input:focus, select:focus { border-color: var(--tiffany); box-shadow: 0 0 0 3px var(--tiffany-50); outline: none; }
button, .btn { font: inherit; min-height: 44px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line-2); background: #fff; color: var(--text); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 550; }
button:hover { border-color: var(--blue); }
button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
button.primary:hover { background: var(--blue-600); }
button.small { min-height: 34px; padding: 4px 12px; font-size: 13px; }
button.link { border: 0; background: none; color: var(--blue); padding: 0; min-height: 0; text-decoration: underline; font-weight: 500; }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; flex-wrap: wrap; }
.tabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 8px 14px; color: var(--muted); }
.tabs button:hover { color: var(--navy); border-color: transparent; }
.tabs button.on { border-bottom-color: var(--tiffany); color: var(--navy); font-weight: 650; }
.tabs .count { font-size: 12px; color: var(--stale); margin-left: 4px; }

/* Department chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 34px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line-2); background: #fff; font-size: 13px; cursor: pointer; }
.chip.on { background: var(--navy); color: #fff; border-color: var(--navy); }

/* Pills */
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.req { background: var(--red-bg); color: var(--red); }
.pill.opt { background: #EEF1F5; color: var(--stale); }
.pill.dept { background: var(--blue-50); color: var(--blue); }
.pill.auto { background: var(--tiffany-50); color: var(--tiffany-600); }
.pill.warn { background: var(--amber-bg); color: var(--amber); }

/* Tables */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12.5px; color: var(--muted); font-weight: 600; background: #FAFCFE; }
td.key { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; color: var(--navy); white-space: nowrap; }
td.label { font-weight: 600; }
td .note { font-size: 12.5px; color: var(--muted); }
tr.gap td { background: var(--tiffany-50); color: var(--tiffany-600); font-size: 12.5px; font-weight: 600; }

.banner { padding: 11px 14px; border-radius: 8px; margin-bottom: 12px; font-weight: 550; border-left: 4px solid currentColor; }
.banner.tiffany { background: var(--tiffany-50); color: var(--tiffany-600); }
.toast { position: fixed; bottom: 20px; right: 20px; background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 8px; opacity: 0; transform: translateY(8px); transition: opacity .25s, transform .25s; pointer-events: none; }
.toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#"><span class="mark" aria-hidden="true">K</span>Kiroku Config</a>
  <nav id="nav" aria-label="Screens"></nav>
  <div class="tools"><span id="dbstat" class="small dbstat"></span></div>
</header>
<main id="app"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/* ---------------- Masterlist: every field the worksheets must carry ----------------
   key      = column header in the worksheet tab (exactly as written here)
   dept     = owner who enters or confirms the field
   req      = required to run Kiroku
   type     = expected format
   source   = where the value comes from today (file → tab → column)
   example  = sample value
   note     = rule, mapping, or open question
   auto     = generated by the system, not typed                                       */
const DEPTS = ['Liaison (Kumiai)', 'Selection', 'Doc Officers', 'Departure & Visa', 'Admin'];

const TABS = [
  { id: 'kumiai', tab: 'Kumiai', title: 'Kumiai', intro: 'Supervising cooperatives on the Japan side. One row per kumiai.', fields: [
    { key: 'kumiai_id',      label: 'Kumiai ID',              dept: 'Admin',            req: true,  type: 'text',   auto: true,  source: 'System',                                   example: 'KUM-001',                note: 'Generated once; never reused.' },
    { key: 'kumiai_code',    label: 'Kumiai code',            dept: 'Liaison (Kumiai)', req: true,  type: 'text',   source: 'Selection → Kumiai List → ABBREV.',        example: 'AIWA',                   note: 'The short code the sheets write (AIWA, KR, TS, G-NET). Must be unique.' },
    { key: 'kumiai_name_en', label: 'Kumiai name (English)',  dept: 'Liaison (Kumiai)', req: true,  type: 'text',   source: 'Selection → Kumiai List → SUPERVISING ORGANIZATION (ENGLISH)', example: 'Aiwa Cooperative', note: '' },
    { key: 'kumiai_name_jp', label: 'Kumiai name (Japanese)', dept: 'Liaison (Kumiai)', req: false, type: 'text',   source: 'Departure → 2026 Summary → 組合 KUMAI',     example: 'あいわ協同組合',           note: 'Used for matching the bilingual labels.' },
    { key: 'supervising_org', label: 'Supervising organization', dept: 'Liaison (Kumiai)', req: false, type: 'text', source: 'Selection → Kumiai List',                 example: '',                       note: '' },
    { key: 'active',         label: 'Active',                 dept: 'Admin',            req: true,  type: 'TRUE/FALSE', source: 'Manual',                              example: 'TRUE',                   note: 'FALSE hides the kumiai from new entries.' },
  ]},
  { id: 'companies', tab: 'Companies', title: 'Companies', intro: 'Receiving companies (第二次受入機関). Each belongs to one kumiai.', fields: [
    { key: 'company_id',     label: 'Company ID',             dept: 'Admin',            req: true,  type: 'text',   auto: true,  source: 'System',                                   example: 'CMP-001',                note: 'Generated once; never reused.' },
    { key: 'company_no',     label: 'Company no.',            dept: 'Selection',        req: true,  type: 'text',   source: 'Manual (not in sheets yet)',               example: 'C-0112',                 note: 'Agency numbering. Confirm the format with the agency.' },
    { key: 'kumiai_code',    label: 'Kumiai code',            dept: 'Liaison (Kumiai)', req: true,  type: 'lookup: Kumiai', source: 'Departure → 2026 Summary → 組合 KUMAI', example: 'AIWA',                   note: 'Pick from the Kumiai tab. Free text is rejected.' },
    { key: 'company_name_en', label: 'Company name (English)', dept: 'Selection',        req: true,  type: 'text',   source: 'Departure → 2026 Summary → 第二次受入機関名 COMPANY', example: 'Sample Company Co.',   note: 'Strip the Japanese part after " / ".' },
    { key: 'company_name_jp', label: 'Company name (Japanese)', dept: 'Selection',       req: false, type: 'text',   source: 'Departure → 2026 Summary → 第二次受入機関名 COMPANY', example: '株式会社サンプル',       note: '' },
    { key: 'name_aliases',   label: 'Name variants',          dept: 'Admin',            req: false, type: 'text, comma-separated', source: 'Derived from label variants', example: 'SAMPLE CO., SAMPLE KOGYO', note: 'Used for matching only. Never shown to users.' },
    { key: 'active',         label: 'Active',                 dept: 'Admin',            req: true,  type: 'TRUE/FALSE', source: 'Manual',                              example: 'TRUE',                   note: '' },
  ]},
  { id: 'workers', tab: 'Workers', title: 'Workers', intro: 'Trainees and workers. The person record; one worker can have several job orders.', fields: [
    { key: 'worker_id',      label: 'Worker ID',              dept: 'Admin',            req: true,  type: 'text',   auto: true,  source: 'System',                                   example: 'WKR-00001',              note: 'Generated once; never reused.' },
    { key: 'worker_no',      label: 'Worker no.',             dept: 'Selection',        req: true,  type: 'text',   source: 'Departure → 2026 Summary → ID#',           example: '3',                      note: 'ID# is only 66% filled. Not unique across the sheet. Do not use as the key alone.' },
    { key: 'name_en',        label: 'Full name (English)',    dept: 'Selection',        req: true,  type: 'text, UPPERCASE', source: 'Departure → 2026 Summary → 名前 NAME', example: 'SAMPLE WORKER ONE', note: 'Surname first, as on the passport.' },
    { key: 'name_kana',      label: 'Name (kana)',            dept: 'Selection',        req: false, type: 'text',   source: 'Departure → 2026 Summary → 氏名カナ',       example: 'サンプル ワーカー',           note: '' },
    { key: 'birthdate',      label: 'Birthdate',              dept: 'Selection',        req: true,  type: 'date YYYY-MM-DD', source: 'Departure → 2026 Summary → 生年月日 BIRTHDATE', example: '1990-01-01', note: 'Person key with name when passport is blank.' },
    { key: 'passport_no',    label: 'Passport no.',           dept: 'Selection',        req: true,  type: 'text P#######X', source: 'Departure → 2026 Summary → パスポート番号', example: 'P0000001A', note: 'Primary person key. Repeats mean the same person on another deployment.' },
    { key: 'passport_expiry', label: 'Passport expiry',       dept: 'Selection',        req: false, type: 'date YYYY-MM-DD', source: 'Departure → 2026 Summary → パスポートYūkō kigen有効期限', example: '2029-03-29', note: 'Warn 90 days before expiry.' },
    { key: 'job_category',   label: 'Job category',           dept: 'Selection',        req: false, type: 'lookup: Work category', source: 'Departure → 2026 Summary → 職種 CATEGORY', example: 'Construction', note: 'Raw labels map to the 5 work categories on the Reference tab.' },
    { key: 'contact_no',     label: 'Contact number',         dept: 'Selection',        req: false, type: 'text',   source: 'Shokai Monitoring → Contact Number 1',     example: '0900-000-0000',          note: 'Personal data. Restrict access by role.' },
    { key: 'medical_status', label: 'Medical status',         dept: 'Departure & Visa', req: false, type: 'lookup: Medical', source: 'Departure → DEPARTURE → MEDICAL',          example: 'OK',                     note: 'Replaces the free-text dates in the MEDICAL column.' },
    { key: 'medical_expiry', label: 'Medical expiry',         dept: 'Departure & Visa', req: false, type: 'date YYYY-MM-DD', source: 'Departure → 2026 Summary → DATE OF PEME EXPIRY', example: '2026-12-31', note: '' },
  ]},
  { id: 'joborders', tab: 'JobOrders', title: 'Job orders', intro: 'The Kiroku unit. One job order = one company, one target entry date, one batch of workers.', fields: [
    { key: 'jo_id',          label: 'JO ID',                  dept: 'Admin',            req: true,  type: 'text',   auto: true,  source: 'System',                                   example: 'JO-0001',                note: 'Kiroku internal key. Do not edit.' },
    { key: 'jo_number',      label: 'JO number',              dept: 'Selection',        req: true,  type: 'text',   source: 'Not in any sheet (Kiroku currently uses 2026-0143 style)', example: '2026-0143', note: 'Open question: agency number or Kiroku-generated.' },
    { key: 'company_id',     label: 'Company ID',             dept: 'Selection',        req: true,  type: 'lookup: Company', source: 'Departure → 2026 Summary → 第二次受入機関名 COMPANY', example: 'CMP-001', note: 'Pick from the Companies tab.' },
    { key: 'target_date',    label: 'Target entry date',      dept: 'Selection',        req: true,  type: 'date YYYY-MM-DD', source: 'Departure → 2026 Summary → 入国予定日 (TARGET DATE)', example: '2026-08-10', note: 'Drives every gate due date (target + offset).' },
    { key: 'selection_date', label: 'Selection date',         dept: 'Selection',        req: false, type: 'date YYYY-MM-DD', source: 'Departure → 2026 Summary → 選定日 (SELECTION DATE); 2024 JO Managing Sheet → SELECTION DATE', example: '2026-01-09', note: '' },
    { key: 'work_category',  label: 'Work category',          dept: 'Selection',        req: true,  type: 'lookup: Work category', source: '2024 JO Managing Sheet → JOB CATEGORIES (76 labels)', example: 'Construction', note: 'Must map to one of the 5 categories.' },
    { key: 'program_type',   label: 'Program type',           dept: 'Selection',        req: true,  type: 'lookup: Program type', source: '2026 Summary → SELECTION STATUS / Visa; 2024 → Visa Type', example: 'TITP1', note: 'Raw labels TITP i, TITPi, SSW, 1GOU, 3号 must be mapped.' },
    { key: 'visa_type',      label: 'Visa type',              dept: 'Selection',        req: false, type: 'text',   source: '2024 JO Managing Sheet → Visa Type',       example: '1GOU',                   note: '' },
    { key: 'headcount_male', label: 'Headcount (male)',       dept: 'Selection',        req: false, type: 'whole number', source: '2024 JO Managing Sheet → APPLICANT (Male)', example: '2',                   note: '' },
    { key: 'headcount_female', label: 'Headcount (female)',   dept: 'Selection',        req: false, type: 'whole number', source: '2024 JO Managing Sheet → APPLICANT (Female)', example: '0',                 note: '' },
    { key: 'active',         label: 'Active',                 dept: 'Doc Officers',     req: true,  type: 'TRUE/FALSE', source: 'Kiroku (Officer 1 only)',                  example: 'TRUE',                   note: 'FALSE = archived.' },
  ]},
  { id: 'links', tab: 'Selection', title: 'Selection (worker ↔ job order)', intro: 'One row per worker per job order. This is where a worker is placed on a JO.', fields: [
    { key: 'link_id',        label: 'Link ID',                dept: 'Admin',            req: true,  type: 'text',   auto: true,  source: 'System',                                   example: 'LNK-0001',               note: '' },
    { key: 'worker_id',      label: 'Worker ID',              dept: 'Selection',        req: true,  type: 'lookup: Worker', source: 'Departure → 2026 Summary (row)',      example: 'WKR-00001',              note: '' },
    { key: 'jo_id',          label: 'JO ID',                  dept: 'Selection',        req: true,  type: 'lookup: JO', source: 'Departure → 2026 Summary (row)',              example: 'JO-0001',                note: '' },
    { key: 'selection_status', label: 'Selection status',     dept: 'Selection',        req: true,  type: 'lookup: Selection status', source: '2026 Summary → SELECTION STATUS', example: 'SELECTED',         note: 'SELECTED / RESERVED / AUTO SELECTED.' },
    { key: 'visa_status',    label: 'Visa status',            dept: 'Departure & Visa', req: false, type: 'lookup: Visa status', source: '2026 Summary → VISA STATUS',         example: 'SSW',                    note: '' },
  ]},
  { id: 'gates', tab: 'Gates', title: 'Gates (per job order)', intro: 'Gate done state. Due dates are generated from the target entry date; the encoder only ticks done.', fields: [
    { key: 'gate_id',        label: 'Gate ID',                dept: 'Admin',            req: true,  type: 'text',   auto: true,  source: 'System',                                   example: 'JO-0001-COE-2',          note: 'JO ID + track + gate order.' },
    { key: 'jo_id',          label: 'JO ID',                  dept: 'Doc Officers',     req: true,  type: 'lookup: JO', source: 'System',                                 example: 'JO-0001',                note: '' },
    { key: 'track',          label: 'Track',                  dept: 'Doc Officers',     req: true,  type: 'lookup: Track', source: 'Reference → Tracks',                   example: 'COE',                    note: 'TIO, OTIT or COE.' },
    { key: 'gate_name',      label: 'Gate',                   dept: 'Doc Officers',     req: true,  type: 'lookup: Gate', source: 'Reference → Gates',                     example: 'Visa done',              note: 'Fixed list per track.' },
    { key: 'due_date',       label: 'Due date',               dept: 'Doc Officers',     req: true,  type: 'date', auto: true, source: 'System (target date + offset)',          example: '2026-08-03',             note: 'Do not type. Recomputed when the target date changes.' },
    { key: 'done',           label: 'Done',                   dept: 'Doc Officers',     req: true,  type: 'TRUE/FALSE', source: 'Kiroku UI or sheet',                   example: 'FALSE',                  note: 'Only the owning officer can change it (see Users).' },
    { key: 'done_date',      label: 'Done date',              dept: 'Doc Officers',     req: false, type: 'date YYYY-MM-DD', source: 'System (set when Done = TRUE)',        example: '2026-07-30',             note: '' },
  ]},
  { id: 'departure', tab: 'Departure', title: 'Departure', intro: 'Departure and milestone records. Source of the COE track status.', fields: [
    { key: 'worker_id',      label: 'Worker ID',              dept: 'Departure & Visa', req: true,  type: 'lookup: Worker', source: 'DEPARTURE MONITORING → DEPARTURE (row)', example: 'WKR-00001',              note: '' },
    { key: 'jo_id',          label: 'JO ID',                  dept: 'Departure & Visa', req: true,  type: 'lookup: JO', source: 'DEPARTURE → COMPANY / BATCH#',           example: 'JO-0001',                note: 'Batch codes like B-404 repeat across companies. Map to a JO before saving.' },
    { key: 'departure_date', label: 'Departure date',         dept: 'Departure & Visa', req: false, type: 'date YYYY-MM-DD', source: 'DEPARTURE → DATE OF DEPARTURE',   example: '2026-08-10',             note: 'Only 36% filled today.' },
    { key: 'departure_time', label: 'Departure time',         dept: 'Departure & Visa', req: false, type: 'time HH:MM', source: 'DEPARTURE → TIME OF DEPARTURE',         example: '23:15',                  note: 'Stored as text; several values are dates.' },
    { key: 'destination',    label: 'Destination',            dept: 'Departure & Visa', req: false, type: 'text',   source: 'DEPARTURE → DESTINATION',                  example: 'Tokyo',                  note: 'Only 4% filled today.' },
    { key: 'visa_status',    label: 'Visa status',            dept: 'Departure & Visa', req: true,  type: 'lookup: Visa status', source: 'DEPARTURE → VISA',                  example: 'STUDIO',                 note: 'Drives the Visa done gate.' },
    { key: 'owwa_pdos_status', label: 'OWWA / PDOS status',   dept: 'Departure & Visa', req: true,  type: 'lookup: OWWA status', source: 'DEPARTURE → OWWA PDOS',             example: 'BILLED 0048',            note: 'Drives the PDOS and OWWA gates.' },
    { key: 'flight_status',  label: 'Flight status',          dept: 'Departure & Visa', req: false, type: 'lookup: Flight status', source: 'DEPARTURE → TENTATIVE FLIGHT / CANCELLED FLIGHT', example: 'CONFIRMED', note: 'Drives the Ticket done gate.' },
    { key: 'remarks',        label: 'Remarks / encoded by',   dept: 'Departure & Visa', req: false, type: 'text',   source: 'DEPARTURE → REMARKS / ENCODED BY',         example: 'ENCODED BY SAMPLE ENCODER', note: 'Free text. The LLM check reads this.' },
  ]},
  { id: 'users', tab: 'Users', title: 'Users and roles', intro: 'Who can see and change what. The role decides which gates a person may tick.', fields: [
    { key: 'user_id',        label: 'User ID',                dept: 'Admin',            req: true,  type: 'text',   auto: true,  source: 'System',                                   example: 'u1',                     note: '' },
    { key: 'name',           label: 'Name',                   dept: 'Admin',            req: true,  type: 'text',   source: 'Manual',                                   example: 'Doc Officer 1',          note: '' },
    { key: 'role',           label: 'Role',                   dept: 'Admin',            req: true,  type: 'lookup: Role', source: 'Manual',                                 example: 'Doc Officer',            note: 'Doc Officer / CEO.' },
    { key: 'department',     label: 'Department',             dept: 'Admin',            req: true,  type: 'lookup: Department', source: 'Manual',                           example: 'Doc Officers',           note: 'Used for filtering this masterlist.' },
    { key: 'email',          label: 'Email',                  dept: 'Admin',            req: false, type: 'email',  source: 'Manual',                                   example: '',                       note: 'Needed for notifications.' },
  ]},
];

const REFERENCE = {
  'Work category': ['Construction', 'Caregiving', 'Manufacturing', 'Agriculture', 'Food Service'],
  'Program type': ['SSW1', 'SSW2', 'TITP1', 'TITP2', 'TITP3'],
  'Track': ['TIO', 'OTIT', 'COE'],
  'Gates (COE)': ['PDOS done', 'Visa done', 'OWWA done', 'Ticket done'],
  'Selection status': ['SELECTED', 'RESERVED', 'AUTO SELECTED'],
  'Role': ['Doc Officer', 'CEO'],
  'Department': DEPTS,
};

/* ---------------- Rendering ---------------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state = { tab: 'kumiai', dept: 'All', q: '' };

function allFields() {
  return TABS.flatMap(t => t.fields.map(f => ({ ...f, tab: t.tab })));
}

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = TABS.map(t => `<a href="#${t.id}" class="${t.id === state.tab ? 'on' : ''}">${esc(t.title.split(' (')[0])}</a>`).join('')
    + `<a href="#reference" class="${state.tab === 'reference' ? 'on' : ''}">Reference</a>`;
}

function renderStats() {
  const f = allFields();
  const req = f.filter(x => x.req).length;
  const auto = f.filter(x => x.auto).length;
  document.getElementById('dbstat').textContent = `${TABS.length} tabs · ${f.length} fields · ${req} required`;
  return `<div class="strip">
    <div><div class="k">Tabs</div><div class="v">${TABS.length}</div></div>
    <div><div class="k">Fields</div><div class="v">${f.length}</div></div>
    <div><div class="k">Required</div><div class="v">${req}</div></div>
    <div><div class="k">System-generated</div><div class="v">${auto}</div></div>
    <div><div class="k">Departments</div><div class="v">${DEPTS.length}</div></div>
  </div>`;
}

function renderTab(t) {
  const fields = t.fields.filter(f => (state.dept === 'All' || f.dept === state.dept) &&
    (!state.q || (f.label + ' ' + f.key + ' ' + f.source + ' ' + f.note).toLowerCase().includes(state.q.toLowerCase())));
  const headerRow = t.fields.map(f => f.key).join('\t');
  const deptChips = ['All', ...DEPTS].map(d => `<button class="chip ${state.dept === d ? 'on' : ''}" data-dept="${esc(d)}">${esc(d)}</button>`).join('');
  return `
    <div class="page-head"><div><div class="eyebrow">Masterlist · worksheet ${esc(t.tab)}</div><h1>${esc(t.title)}</h1><p class="muted">${esc(t.intro)}</p></div>
      <div class="row">
        <button class="small" id="copy-header" data-header="${esc(headerRow)}">Copy header row</button>
        <button class="small primary" id="export-csv" data-tab="${esc(t.tab)}">Export header CSV</button>
      </div></div>
    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <div class="chips">${deptChips}</div>
        <input type="search" id="q" placeholder="Search fields…" value="${esc(state.q)}" style="max-width:280px">
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Column header (worksheet)</th><th>Label</th><th>Owner</th><th>Required</th><th>Format</th><th>Where it comes from today</th><th>Example</th><th>Note</th></tr></thead>
        <tbody>${fields.map(f => `<tr>
          <td class="key">${esc(f.key)}</td>
          <td class="label">${esc(f.label)}${f.auto ? ' <span class="pill auto">auto</span>' : ''}</td>
          <td><span class="pill dept">${esc(f.dept)}</span></td>
          <td>${f.req ? '<span class="pill req">Required</span>' : '<span class="pill opt">Optional</span>'}</td>
          <td class="small">${esc(f.type)}</td>
          <td class="small">${esc(f.source)}</td>
          <td class="small">${esc(f.example)}</td>
          <td class="note">${esc(f.note)}</td>
        </tr>`).join('') || `<tr><td colspan="8" class="muted">No fields match this filter.</td></tr>`}</tbody>
      </table></div>
    </div>`;
}

function renderReference() {
  return `
    <div class="page-head"><div><div class="eyebrow">Masterlist · lookups</div><h1>Reference lists</h1>
      <p class="muted">Fixed values that the lookup columns must match. Change a value here before using it in a worksheet.</p></div></div>
    <div class="cols" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px">
      ${Object.entries(REFERENCE).map(([name, values]) => `<div class="card">
        <h2>${esc(name)}</h2>
        <p class="small muted">${values.length} values</p>
        <div class="stack">${values.map(v => `<div class="row"><span class="pill blue">${esc(v)}</span></div>`).join('')}</div>
      </div>`).join('')}
    </div>
    <div class="banner tiffany" style="margin-top:16px">Sheet tabs must use these exact spellings. Lookups reject anything else, which is what stops TITP i / TITPi / TITP iii drifting apart.</div>`;
}

function render() {
  renderNav();
  const app = document.getElementById('app');
  if (state.tab === 'reference') {
    app.innerHTML = `<section class="page">${renderStats()}${renderReference()}</section>`;
    return;
  }
  const t = TABS.find(x => x.id === state.tab) || TABS[0];
  const tabBar = `<div class="tabs" role="tablist">${TABS.map(x => `<button class="${x.id === t.id ? 'on' : ''}" data-tab="${x.id}">${esc(x.tab)}<span class="count">${x.fields.length}</span></button>`).join('')}</div>`;
  app.innerHTML = `<section class="page">${renderStats()}${tabBar}${renderTab(t)}</section>`;
  bind();
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 1800);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('Header row copied — paste into the worksheet.'); }
  catch (e) { toast('Copy blocked by the browser. Use Export header CSV instead.'); }
}

function exportCsv(tabName) {
  const t = TABS.find(x => x.tab === tabName);
  const header = t.fields.map(f => f.key).join(',');
  const blob = new Blob([header + '\n'], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${t.tab}_header.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast(`${t.tab} header exported.`);
}

function bind() {
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { location.hash = b.dataset.tab; });
  document.querySelectorAll('[data-dept]').forEach(b => b.onclick = () => { state.dept = b.dataset.dept; render(); });
  const q = document.getElementById('q');
  if (q) {
    q.oninput = () => { state.q = q.value; render(); document.getElementById('q').focus(); document.getElementById('q').setSelectionRange(q.value.length, q.value.length); };
  }
  const copy = document.getElementById('copy-header');
  if (copy) copy.onclick = () => copyText(copy.dataset.header.replace(/&quot;/g, '"'));
  const exp = document.getElementById('export-csv');
  if (exp) exp.onclick = () => exportCsv(exp.dataset.tab);
}

function route() {
  const h = location.hash.replace('#', '');
  if (h === 'reference' || TABS.some(t => t.id === h)) state.tab = h;
  render();
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
